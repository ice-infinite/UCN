module: cluster
description: 可选 MCU-first Cluster；Phase 唯一状态源、opaque static storage、Current v3 FSM 与隔离的 Target 组件。
entry: cluster.ucn_cluster_step
source_files:
  - src/extended/ucn_cluster.c
  - src/extended/cluster/ucn_cluster_fsm.c
  - src/extended/cluster/ucn_cluster_codec_v3.c
  - src/extended/cluster/ucn_cluster_authority.c
  - src/extended/cluster/ucn_cluster_persistence_runtime.c

nodes:
  - id: cluster.owner_storage
    symbol: ucn_cluster_t
    type: opaque_storage
    file: include/ucn/ucn_cluster_storage.h
    layer: extended
    role: 唯一 Protocol Owner 的固定静态存储；应用只通过 public view/API 访问。
    called_by: [external.unique_protocol_owner]
    calls: []
    notes:
      - API/storage layout v2；默认预算 2048 B，当前 Host object 1608 B。
      - Cluster 源码禁止动态分配。

  - id: cluster.ucn_cluster_sync_node_neighbors
    symbol: ucn_cluster_sync_node_neighbors
    type: function
    file: src/extended/ucn_cluster.c
    layer: extended
    role: 从 Core 只读复制一跳 Neighbor 摘要到固定 Peer 表。
    called_by: [external.unique_protocol_owner]
    calls:
      - target: external.ucn_node_copy_neighbor_summaries
        type: direct
        reason: 获取 bounded ADMITTED/SUSPECT 输入。

  - id: cluster.ucn_cluster_receive
    symbol: ucn_cluster_receive
    type: callback
    file: src/extended/ucn_cluster.c
    layer: extended
    role: 默认生产入口；严格解码 32 B format v3，并在任何副作用前执行 source/Authority/Persistence/Phase 门禁。
    called_by: [external.cluster_endpoint_handler]
    calls:
      - target: cluster.ucn_cluster_message_decode
        type: direct
        reason: 严格 v3 Type 1..19 解析。
      - target: cluster.cluster_transition
        type: direct
        reason: 唯一 Phase commit 入口。
      - target: cluster.invariant_check
        type: debug
        reason: Debug RX 完成后 fail-fast。
    notes:
      - production v3 Backup/Takeover Authority Type 8,10..15,18,19 fail-closed。
      - production v4 RX 尚受 M05 AUDIT HOLD 冻结。

  - id: cluster.ucn_cluster_step
    symbol: ucn_cluster_step
    type: scheduler
    file: src/extended/ucn_cluster.c
    layer: extended
    role: 推进 Current FSM、Persistence continuation、Authority preflight、租约和 bounded TX。
    called_by: [external.unique_protocol_owner]
    calls:
      - target: external.authoritative_monotonic_clock
        type: callback
        reason: uint32 half-range 时间代数。
      - target: cluster.cluster_transition
        type: direct
        reason: 提交唯一生命周期 Phase。
      - target: external.cluster_send_callback
        type: callback
        reason: 发送默认 32 B v3 控制帧。
      - target: cluster.invariant_check
        type: debug
        reason: Debug Step 完成后 Safety-1..10 fail-fast。

  - id: cluster.cluster_transition
    symbol: cluster_transition
    type: internal_function
    file: src/extended/cluster/ucn_cluster_fsm.c
    layer: extended
    role: 验证转换矩阵并原子提交 Phase/reason/count；Role 由 Phase 纯派生。
    called_by:
      - cluster.ucn_cluster_receive
      - cluster.ucn_cluster_step
    calls: []

  - id: cluster.invariant_check
    symbol: ucn_cluster_invariant_check
    type: diagnostic
    file: src/extended/cluster/ucn_cluster_invariant.c
    layer: extended
    role: 只读 Safety-1..10 位图检查，不修复状态。
    called_by:
      - cluster.ucn_cluster_receive
      - cluster.ucn_cluster_step
    calls: []

  - id: cluster.persistence
    symbol: cluster_persistence_submit
    type: provider_boundary
    file: src/extended/cluster/ucn_cluster_persistence_runtime.c
    layer: extended
    role: load-before-init、persist-before-promise、PENDING fence、reload+journal 验证和重入门。
    called_by:
      - cluster.ucn_cluster_receive
      - cluster.ucn_cluster_step
    calls:
      - target: external.cluster_persist_provider
        type: callback
        reason: 产品实现的同步/异步 durable storage。

  - id: cluster.wire_v4_isolated
    symbol: ucn_cluster_wire_v4_decode
    type: isolated_archive
    file: src/extended/cluster/ucn_cluster_codec_v4.c
    layer: extended_experimental
    role: 40 B Type 1..33 strict codec、semantic 和 replay pending；默认 encoder 关闭。
    called_by: [tests.only]
    calls: []
    notes:
      - 与 v3 compat、dual dispatcher 分 archive。
      - 不接 production RX/TX/FSM/Authority。

  - id: cluster.target_experimental
    symbol: target_owners
    type: isolated_archives
    file: src/extended/cluster/
    layer: extended_experimental
    role: Config、Takeover、Handover、Rekey 的 default-OFF owner/model。
    called_by: [tests.only]
    calls:
      - target: cluster.persistence
        type: contract
        reason: 复用 durable proof 和 Fence 合同。
