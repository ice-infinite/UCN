module: neighbor
description: Candidate→Admitted→Suspect/Expired 生命周期，以及同一对端多个 Bearer 的主备管理。
entry: neighbor.ucn_node_observe_neighbor
source_files:
  - src/ucn_node.c
  - include/ucn/ucn_neighbor.h

nodes:
  - id: neighbor.ucn_node_observe_neighbor
    symbol: ucn_node_observe_neighbor
    type: function
    file: src/ucn_node.c
    layer: routing
    role: Adapter 观察到候选 Link 后创建/刷新 Candidate Neighbor 状态。
    called_by:
      - external.adapter_discovery
    calls:
      - target: neighbor.candidate_link_helpers_static
        type: direct
        reason: 验证候选 Link 的 MTU、Peer Node ID 和状态。
    notes:
      - 只建立候选，不等同于网络准入；后续通过 HELLO 和 Join Policy。

  - id: neighbor.ucn_node_broadcast_hello
    symbol: ucn_node_broadcast_hello
    type: function
    file: src/ucn_node.c
    layer: routing
    role: 在指定发现 Link 上发送最小 HELLO，声明本 Node 身份和网络。
    called_by:
      - node_runtime.protocol_task_mainloop
      - external.discovery_timer
    calls:
      - target: node_runtime.send_control_on_link_static
        type: direct
        reason: 编码并发送 HELLO 控制帧。

  - id: neighbor.handle_hello_static
    symbol: handle_hello
    type: function
    file: src/ucn_node.c
    layer: routing
    role: 收到 HELLO 后验证 Node 身份并依据 Join Policy 创建或合并 Bearer。
    called_by:
      - node_runtime.ucn_node_receive
    calls:
      - target: neighbor.admit_neighbor_entry_static
        type: direct
        reason: OPEN/Provider/手动策略允许时登记 Neighbor 与 Bearer。
      - target: node_runtime.ucn_node_register_link
        type: direct
        reason: 准入后让 Link 参与普通 UCN 流量。
    notes:
      - 同一 peer_node_id 的第二 Link 增加 Bearer，不占第二个 Neighbor 身份槽。

  - id: neighbor.admit_neighbor_entry_static
    symbol: admit_neighbor_entry
    type: function
    file: src/ucn_node.c
    layer: routing
    role: 写入固定 Neighbor/Bearer 表，执行 Join Provider/人工准入并选择初始 Primary。
    called_by:
      - neighbor.handle_hello_static
      - neighbor.ucn_node_admit_neighbor
    calls:
      - target: external.neighbor_authorize_provider
        type: callback
        reason: UCN_JOIN_PROVIDER 模式下检查候选 Node/Bearer。
    notes:
      - 表满或第二 Bearer 不被授权会拒绝，不淘汰已健康 Bearer。

  - id: neighbor.maintain_neighbor_liveness_static
    symbol: maintain_neighbor_liveness
    type: function
    file: src/ucn_node.c
    layer: routing
    role: 基于每 Bearer 的 last_seen/状态推进正常、SUSPECT、Down 和全失效回收。
    called_by:
      - node_runtime.ucn_node_step
    calls:
      - target: neighbor.bearer_lifecycle_helpers_static
        type: direct
        reason: 单 Bearer 超时/Driver Down 时切换其状态。
      - target: route.route_invalidation_helpers_static
        type: direct
        reason: 全部 Bearer 失效并移除 Neighbor 时清相关动态 Route。
      - target: policy_path.path_invalidation_helpers_static
        type: direct
        reason: 逻辑下一跳完全失效时缩小范围撤销 Path。
    notes:
      - 单 Bearer Down 保留 Neighbor、Route 与其他健康 Bearer；全 Down 才回收。

  - id: neighbor.send_due_heartbeat_static
    symbol: send_due_heartbeat
    type: function
    file: src/ucn_node.c
    layer: routing
    role: 向每个已准入直连 Neighbor 的当前 Primary 发送一跳 Heartbeat。
    called_by:
      - node_runtime.ucn_node_step
    calls:
      - target: node_runtime.send_control_on_link_static
        type: direct
        reason: 发送 Heartbeat 控制帧。
    notes:
      - Heartbeat 不全网泛洪；其他中继不会因为它收到远端 Neighbor 的心跳。

  - id: neighbor.evaluate_bearer_quality_static
    symbol: evaluate_bearer_quality
    type: function
    file: src/ucn_node.c
    layer: routing
    role: 基于 Link Cost 和一跳 Probe/ACK 判断是否把同一 Neighbor 的 Backup 升为 Primary。
    called_by:
      - node_runtime.ucn_node_step
    calls:
      - target: neighbor.bearer_lifecycle_helpers_static
        type: direct
        reason: 候选优于主链且满足连续样本/ACK 门槛后切换。
      - target: neighbor.bearer_lifecycle_helpers_static
        type: direct
        reason: 对候选 Bearer 发起一跳 Heartbeat Probe。
    notes:
      - 默认须低至少 20%、连续 3 个 500 ms 窗口、2 次 ACK；不是每帧换链。

  - id: neighbor.candidate_link_helpers_static
    symbol: link_is_candidate_eligible
    type: function
    file: src/ucn_node.c
    layer: routing
    role: 核验候选 Link 的指针、MTU、对端身份和可用状态。
    called_by:
      - neighbor.ucn_node_observe_neighbor
      - node_runtime.ucn_node_register_link
    calls: []

  - id: neighbor.bearer_lifecycle_helpers_static
    symbol: mark_neighbor_bearer_down/switch_neighbor_primary/send_due_bearer_quality_probe
    type: module
    file: src/ucn_node.c
    layer: routing
    role: 单 Bearer Down 标记、Primary 切换以及一跳质量 Probe/ACK 的内部辅助组。
    called_by:
      - neighbor.maintain_neighbor_liveness_static
      - neighbor.evaluate_bearer_quality_static
    calls:
      - target: node_runtime.send_control_on_link_static
        type: direct
        reason: 在候选 Bearer 上发送一跳 Heartbeat Probe。

  - id: neighbor.touch_neighbor_static
    symbol: touch_neighbor
    type: function
    file: src/ucn_node.c
    layer: routing
    role: 已准入 Link 收到有效帧后更新对应 Bearer 的最后活动时间和存活状态。
    called_by:
      - node_runtime.ucn_node_receive
      - neighbor.handle_heartbeat_static
    calls: []
