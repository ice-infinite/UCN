module: node_runtime
description: ucn_node_t 的初始化、收包总入口、业务转发与单线程调度器。
entry: node_runtime.ucn_node_step
source_files:
  - src/ucn_node.c
  - src/ucn_duplicate_internal.h

nodes:
  - id: node_runtime.ucn_node_init
    symbol: ucn_node_init
    type: function
    file: src/ucn_node.c
    layer: core
    role: 清零 Node 固定状态表，保存配置，初始化默认安全/准入/令牌与会话状态。
    called_by:
      - external.product_startup
      - external.host_adapter_startup
    calls:
      - target: core.ucn_validate_config
        type: direct
        reason: 拒绝非法 Network ID、Node ID 或 Hop Limit。
      - target: external.port_random
        type: external
        reason: 产品 Port 提供随机/会话来源时用于会话初始化。
    notes:
      - 一个 MCU 保持一个 Node；不在每个业务 Task 中创建 Node。

  - id: node_runtime.ucn_node_register_link
    symbol: ucn_node_register_link
    type: function
    file: src/ucn_node.c
    layer: core
    role: 将已打开的统一 Link 注册到 Node 固定 Link 表；静态 mtu=0 允许由 get_status().mtu 在运行时提供逻辑上限。
    called_by:
      - external.adapter_init
      - neighbor.admit_neighbor_entry_static
    calls:
      - target: neighbor.candidate_link_helpers_static
        type: direct
        reason: 检查 MTU、状态、对端 Node ID 等候选条件。
    notes:
      - 同一对端可注册多个 Link 并合并为一个 Neighbor 的多个 Bearer。

  - id: node_runtime.ucn_node_set_endpoint_handler
    symbol: ucn_node_set_endpoint_handler
    type: function
    file: src/ucn_node.c
    layer: core
    role: 为一个静态 Endpoint 注册唯一接收回调和上下文。
    called_by:
      - service.ucn_service_protocol_bridge_install_endpoint_handlers
      - external.single_context_application
    calls:
      - target: core.ucn_endpoint_is_static
        type: direct
        reason: 只允许业务静态 Endpoint 注册 handler。
    notes:
      - 已被 Bridge 或其他组件占用的 Endpoint 不应被覆盖；回调运行在 Protocol Task。

  - id: node_runtime.send_control_on_link_static
    symbol: send_control_on_link/send_control_on_link_profile/send_control_on_link_adaptive
    type: function
    file: src/ucn_node.c
    layer: core
    role: 以固定、显式或自适应 Wire Profile 组装控制帧，并在字段可表达、Peer RX Ceiling 与 MTU 都满足后从指定 Link 发送。
    called_by:
      - neighbor.ucn_node_broadcast_hello
      - neighbor.send_due_heartbeat_static
      - neighbor.bearer_lifecycle_helpers_static
      - route.route_request_helpers_static
      - diagnostic.path_trace_runtime_helpers_static
      - diagnostic.node_snapshot_runtime_helpers_static
    calls:
      - target: node_runtime.send_frame_on_link_static
        type: direct
        reason: 复用统一帧编码和具体 Link 发送。
    notes:
      - 控制帧不能作为业务 E2E 帧发送，也不携带 Path ID。
      - 已收到的控制帧在转发/回复时保持请求 Profile；新发控制帧的 Auto 模式选择能表达完整语义的最小档。

  - id: node_runtime.send_control_to_node_static
    symbol: send_control_to_node
    type: function
    file: src/ucn_node.c
    layer: core
    role: 查找到指定 Node 的当前 Route 后发送单播控制帧。
    called_by:
      - route.handle_route_request_static
      - route.handle_route_reply_static
      - route.handle_route_error_static
      - policy_path.ucn_node_send_path_install
      - diagnostic.policy_diagnostic_runtime_helpers_static
    calls:
      - target: route.route_lookup_helpers_static
        type: direct
        reason: 解析当前可用直连/Route egress。
      - target: node_runtime.send_control_on_link_static
        type: direct
        reason: 在解析出的 Link 上发送控制帧。

  - id: node_runtime.ucn_node_receive
    symbol: ucn_node_receive
    type: function
    file: src/ucn_node.c
    layer: core
    role: 所有接收帧的唯一 Core 入口：先按 3 B Prefix 与 per-Link RX Ceiling 早拒绝，再完整解码；Network 通过后执行运行期 Hop Scope，然后才进入安全/去重、控制面、转发或目标 Endpoint 分发。
    called_by:
      - adapter.ucn_adapter_rx_pump
    calls:
      - target: security.ucn_node_security_ready
        type: direct
        reason: Required 配置未完成时不解码、不处理或转发入站帧。
      - target: frame.ucn_frame_peek_wire_profile
        type: direct
        reason: 在完整 Decode/CRC 前解析固定 Prefix，并按 Node/Link 本地 RX Ceiling 拒绝超档帧。
      - target: frame.ucn_frame_decode
        type: direct
        reason: 通过早期 Profile 门禁后验证完整线格式、长度、字段和 CRC。
      - target: node_runtime.validate_inbound_hop_scope_static
        type: direct
        reason: 在 Security 与任何 Route/Path/去重状态改变前拒绝超出 Node 运行期参与范围的帧。
      - target: security.validate_inbound_business_security
        type: direct
        reason: 执行 Provider 授权、端点安全策略、必要时解密。
      - target: node_runtime.ucn_duplicate_accept_frame_static
        type: direct
        reason: 非 RREQ 帧按 Source/Session Sequence 位图拒绝重复和窗口外旧帧。
      - target: neighbor.handle_hello_static
        type: direct
        reason: HELLO 是未注册 Link 唯一可先处理的控制帧。
      - target: neighbor.touch_neighbor_static
        type: direct
        reason: 已准入 Link 的有效入站活动刷新 liveness。
      - target: route.rreq_cache_classify_commit_static
        type: direct
        reason: RREQ 独立执行格式校验、New/Better/Replay 分类、Peer Token 与成功后 Best Cost 提交。
      - target: route.handle_route_request_static
        type: direct
        reason: 处理/泛洪 RREQ 并学习反向路径。
      - target: route.handle_route_reply_static
        type: direct
        reason: 学习/候选激活 Route，或继续向源转发 RREP。
      - target: route.handle_route_error_static
        type: direct
        reason: 失效受影响动态 Route/Path 并按需回传。
      - target: policy_path.handle_path_install_static
        type: direct
        reason: 已授权时安装逐跳 Path 转发表。
      - target: policy_path.handle_path_revoke_static
        type: direct
        reason: 已授权且管理源预算允许时撤销逐跳 Path 转发表。
      - target: diagnostic.control_handlers
        type: direct
        reason: 分派 Trace、Snapshot、Policy Diagnostic 控制帧。
      - target: node_runtime.forward_or_dispatch_static
        type: direct
        reason: 非本机目的帧转发；本机业务帧进入 Endpoint handler。
    notes:
      - 控制帧不能带 E2E/Path 组合；未准入 Link 的普通业务帧会被拒绝。
      - 去重键为线上帧身份，不把同一帧多次投递业务任务。

  - id: node_runtime.validate_inbound_hop_scope_static
    symbol: validate_inbound_hop_scope
    type: function
    file: src/ucn_node.c
    layer: core
    role: 统一执行 Frame 当前 Hop、RREQ 原始 Ring Scope、RREP 已走 Hop 和 PATH_INSTALL Remaining Hops 的运行期硬边界。
    called_by:
      - node_runtime.ucn_node_receive
    calls: []
    notes:
      - 上限来自 default_hop_limit，且配置校验保证它不超过编译期 UCN_MAX_HOPS。
      - Nano 在独立静态收包实现中执行相同的普通 Frame Hop 门禁。

  - id: node_runtime.forward_or_dispatch_static
    symbol: forward_or_dispatch_static
    type: module
    file: src/ucn_node.c
    layer: core
    role: 收包末段的二选一：中继转发，或目的 Node 的通用 RX/Endpoint handler 分发。
    called_by:
      - node_runtime.ucn_node_receive
    calls:
      - target: node_runtime.send_frame_on_link_static
        type: direct
        reason: 中继前递减 Hop Limit，解析 Route/Path 的下一跳并发送。
      - target: node_runtime.forward_or_dispatch_static
        type: callback
        reason: 目的 Node 命中静态 Endpoint 后调用唯一 handler。
      - target: external.application_rx_handler
        type: callback
        reason: 未被 Endpoint handler 占用时可交给通用 RX handler。
    notes:
      - 中继不会调用 Service Router，不会把发往其他 Node 的业务帧投递本机 Task。

  - id: node_runtime.send_frame_on_link_static
    symbol: send_frame_on_link
    type: function
    file: src/ucn_node.c
    layer: core
    role: 读取 Link 状态，对未选档的源发业务帧准备固定/自动 Wire Profile，再编码并调用具体 Link 的 send；转发帧保留原 Profile。
    called_by:
      - route.ucn_node_send
      - route.ucn_node_send_path
      - node_runtime.forward_or_dispatch_static
      - node_runtime.send_control_on_link_static
    calls:
      - target: node_runtime.prepare_outbound_wire_profile_static
        type: direct
        reason: 源发帧按 Node 模式、Peer Ceiling 和 Link MTU 固定或自动选档。
      - target: frame.ucn_frame_encode
        type: direct
        reason: 生成最终线上帧。
      - target: external.link_ops_send
        type: external
        reason: 交给 ESP-NOW/UART/CAN/BLE/LoRa 等 Adapter 的发送实现。
    notes:
      - Link send 成功只代表本介质接受该帧；端到端业务执行需由上层结果 Endpoint/确认协议表达。

  - id: node_runtime.prepare_outbound_wire_profile_static
    symbol: prepare_outbound_wire_profile
    type: function
    file: src/ucn_node.c
    layer: core
    role: 合并 Node 固定 TX 档、自动开关、Link Peer Ceiling、实际 MTU 与当前帧 Route Hop/Path/Tag 要求。
    called_by:
      - node_runtime.send_frame_on_link_static
      - security.protect_outbound_business
    calls:
      - target: frame.ucn_frame_select_min_wire_profile
        type: direct
        reason: 自动模式选择满足全部约束的最小官方档。
    notes:
      - 显式已有 Profile 的转发帧只验证出口兼容性，不重新编码到另一档。

  - id: node_runtime.ucn_duplicate_accept_frame_static
    symbol: ucn_duplicate_accept_frame
    type: function
    file: src/ucn_duplicate_internal.h
    layer: core
    role: 在固定 Source/Session 槽中滑动 32/64 bit Sequence 位图；窗口内乱序可补收，重复/过旧拒绝，活跃来源表满失败关闭。
    called_by:
      - node_runtime.ucn_node_receive
    calls: []
    notes:
      - Session=0 兼容开发网络，但重启复用 Sequence 在 60 s 窗口过期前按 Replay 处理。
      - 这是易失网络去重，不是认证或生产 Security Replay Window。

  - id: node_runtime.ucn_node_step
    symbol: ucn_node_step
    type: scheduler
    file: src/ucn_node.c
    layer: core
    role: 唯一 Protocol Task 的有界维护与发送调度入口；同时观测相邻 Step 的实际时间间隔。
    called_by:
      - external.protocol_task_iteration
      - node_runtime.protocol_task_mainloop
    calls:
      - target: security.ucn_node_security_ready
        type: direct
        reason: Required 配置未完成时不运行维护或业务调度。
      - target: neighbor.maintain_neighbor_liveness_static
        type: direct
        reason: 超时状态、单/全 Bearer Down 和动态回收。
      - target: neighbor.evaluate_bearer_quality_static
        type: direct
        reason: 评估主备质量、Probe ACK 和切换滞回。
      - target: policy_path.ucn_policy_refresh_link_quality
        type: direct
        reason: 采样每条物理 Link 的通用 Cost/RTT/失败率/队列压力。
      - target: policy_path.refresh_policy_path_bearers_static
        type: direct
        reason: 采样完成后按逻辑 Neighbor 当前实际 Bearer 更新 Policy Path 活性和拥塞。
      - target: policy_path.ucn_policy_expire_flows
        type: direct
        reason: 回收到期 Q1 Flow 绑定。
      - target: policy_path.ucn_path_expire
        type: direct
        reason: 回收过期逐跳 Path 表项。
      - target: route.route_discovery_ring_helpers_static
        type: direct
        reason: 到期时扩大一个 Discovery Ring，或在总预算/最大 Hop 到达后结束发现。
      - target: route.ucn_node_send
        type: direct
        reason: 优先发送 Q0，再发送 Q1 固定 TX 项。
      - target: route.send_pending_q1_if_ready_static
        type: direct
        reason: Route 建立后发送首包等待槽中的最新 Q1。
      - target: node_runtime.send_due_essential_maintenance_static
        type: direct
        reason: 连续业务达到上限后，或业务空闲时，检查真正到期的保活、Probe 与 Route Refresh。
      - target: diagnostic.send_due_diagnostics_static
        type: direct
        reason: 在业务、保活、Probe 后发送 Snapshot/Policy 等低频 Reply/Request。
    notes:
      - 连续 `UCN_BUSINESS_TX_BURST_BEFORE_MAINTENANCE`（默认 4）个业务发送后，真正到期的必要维护可取得一个槽位；Q0 仍 FIFO，Snapshot/Policy Diagnostic 不抢占业务。
      - 调度顺序为 Q0 → Q1 / Pending Q1；必要维护在业务空闲时立即检查，或在到期且达到连续业务上限时插入；诊断始终在上述工作后。
      - 显式 `RETRY_ON_BACKPRESSURE` 的 Q0 只在 `NO_SPACE` 时保留原槽；等待下一次尝试期间不让 Q1 越序，但到期的必要维护仍可运行。
      - 第一次 Step 只建立时间基线；之后以回绕安全的无符号差值更新 `last_step_ms`、`max_step_gap_ms`、`step_interval_violations`。
      - Heartbeat 与 Bearer/Path Probe 成功发送时，同时更新相对到期时刻的最大服务延迟统计，供目标板日志观测。
      - 产品 `UCN_MAX_STEP_INTERVAL_MS` 与 Burst/Neighbor/Bearer 上限共同形成保守维护服务上界；侵入 Suspect 窗口的 Profile 在编译期拒绝。
      - 每次只消费一个普通 TX 项；产品循环需持续调用，不能在业务 Task 中替代它。

  - id: node_runtime.send_due_essential_maintenance_static
    symbol: send_due_essential_maintenance
    type: function
    file: src/ucn_node.c
    layer: core
    role: 依次检查到期 Heartbeat、Bearer Quality Probe、Path Probe 与 Route Refresh；只有实际动作才消耗调度槽位。
    called_by:
      - node_runtime.ucn_node_step
    calls:
      - target: neighbor.send_due_heartbeat_static
        type: direct
        reason: 发送一跳 Heartbeat 并刷新反向可见性。
      - target: neighbor.bearer_lifecycle_helpers_static
        type: direct
        reason: 在候选 Bearer 已满足滞回条件时发送质量 Probe。
      - target: route.start_due_route_refresh_static
        type: direct
        reason: Route 进入刷新窗口时启动候选发现。
    notes:
      - Path Probe 也在此函数内执行；该函数不包含 Snapshot 或 Policy Diagnostic。
      - "UCN_ERR_NOT_FOUND 表示没有到期维护，调用者继续处理业务；其他返回值保持既有错误语义。"

  - id: node_runtime.protocol_task_mainloop
    symbol: protocol_task_mainloop
    type: module
    file: product_port_or_main_loop
    layer: application
    role: 推荐产品循环：有限 RX Pump、有限 Service Bridge、Node step、按周期 HELLO。
    called_by:
      - external.rtos_task_or_arduino_loop
    calls:
      - target: adapter.ucn_adapter_rx_pump
        type: direct
        reason: 将驱动 RX 固定副本交给 Node。
      - target: service.ucn_service_protocol_bridge_step_at
        type: direct
        reason: 用本轮同一 now_ms 将 Remote TX 或固定 Pending Q0 有界送入 Core。
      - target: node_runtime.ucn_node_step
        type: direct
        reason: 执行唯一 Node 调度。
      - target: neighbor.ucn_node_broadcast_hello
        type: direct
        reason: 发现型 Adapter 在受控周期广播 HELLO。
