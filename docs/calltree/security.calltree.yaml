module: security
description: Security Provider 挂接、Node/Endpoint 策略、端到端加解密和透明中继边界。
entry: security.ucn_node_set_security
source_files:
  - src/ucn_node.c
  - src/ucn_frame.c
  - include/ucn/ucn_security.h

nodes:
  - id: security.ucn_node_set_security
    symbol: ucn_node_set_security
    type: function
    file: src/ucn_node.c
    layer: security
    role: 挂接产品实现的 ucn_security_ops_t 和上下文，加载序号/Session 基础状态。
    called_by:
      - external.product_security_init
    calls:
      - target: external.security_provider_load_next_sequence
        type: callback
        reason: 恢复掉电后不回退的发送序号。
      - target: external.security_provider_get_session_id
        type: callback
        reason: 获取本次 Node Session ID。
    notes:
      - Core 不内置生产 AEAD、密钥存储或身份库；Provider 可实现原子 Session/Key 轮换。

  - id: security.ucn_node_set_security_required
    symbol: ucn_node_set_security_required
    type: function
    file: src/ucn_node.c
    layer: security
    role: 在运行时启用或关闭失败关闭门禁；产品也可用 UCN_SECURITY_REQUIRED_BY_DEFAULT=1 从初始化起强制启用。
    called_by:
      - external.product_security_init
    calls: []
    notes:
      - Nano 没有 Security Feature，required=true 返回配置错误；编译期强制安全的 Nano 直接构建失败。

  - id: security.ucn_node_security_ready
    symbol: ucn_node_security_ready
    type: function
    file: src/ucn_node.c
    layer: security
    role: 核对 Provider、Session、授权、seal/open 和 Node/Endpoint 禁止明文策略是否全部就绪。
    called_by:
      - node_runtime.ucn_node_step
      - route.ucn_node_send
      - node_runtime.ucn_node_receive
      - external.product_security_init
    calls: []
    notes:
      - Required 且未就绪时，协议 Step、发送和接收均返回 UCN_ERR_SECURITY；此检查不能证明 Provider 使用审计过的 AEAD。

  - id: security.allocate_sequence_static
    symbol: allocate_sequence
    type: function
    file: src/ucn_node.c
    layer: security
    role: 分配并持久化发送 Sequence；接近阈值时要求 Provider 先原子轮换 Session。
    called_by:
      - node_runtime.send_frame_on_link_static
    calls:
      - target: external.security_provider_rotate_session
        type: callback
        reason: 建立新 Session/Key 并把 Sequence 重新置于有效起点。
      - target: external.security_provider_store_next_sequence
        type: callback
        reason: 在帧可发送前持久化下一序号。
    notes:
      - 没有轮换回调、Provider 失败或返回重复 Session 时失败关闭，不允许同 Session 回绕。

  - id: security.ucn_node_set_security_policy
    symbol: ucn_node_set_security_policy
    type: function
    file: src/ucn_node.c
    layer: security
    role: 设置 Node 默认 TX/RX/Forward 安全策略。
    called_by:
      - external.product_security_init
    calls: []

  - id: security.ucn_node_set_endpoint_security_policy
    symbol: ucn_node_set_endpoint_security_policy
    type: function
    file: src/ucn_node.c
    layer: security
    role: 覆盖单个 Endpoint 的默认安全策略。
    called_by:
      - external.product_security_init
    calls: []
    notes:
      - 可实现某些 Endpoint 强制加密、另一些按需明文/密文的产品策略。

  - id: security.protect_outbound_business
    symbol: protect_outbound_business
    type: function
    file: src/ucn_node.c
    layer: security
    role: 在业务帧发送前先确定保护 Flag，再让 Wire 选档把 16 B Tag/MTU 纳入计算，最后生成 AAD、调用 seal 并附加 Tag。
    called_by:
      - route.ucn_node_send
      - route.ucn_node_send_path
    calls:
      - target: external.security_provider_authorize_tx
        type: callback
        reason: 产品 ACL/身份策略批准本次发送。
      - target: external.security_provider_select_tx_protection
        type: callback
        reason: 在 AUTO 策略下决定当前帧是否保护。
      - target: node_runtime.prepare_outbound_wire_profile_static
        type: direct
        reason: E2E Flag 确定后才选档，确保 Tag 不会让最终帧越过 MTU。
      - target: frame.ucn_frame_write_e2e_aad
        type: direct
        reason: 绑定不可变的业务身份和 Path ID。
      - target: external.security_provider_seal
        type: callback
        reason: 使用产品 AEAD 加密并生成认证 Tag。
      - target: external.security_provider_store_next_sequence
        type: callback
        reason: 持久化递增后的序号，避免重放窗口回退。

  - id: security.validate_inbound_business_security
    symbol: validate_inbound_business_security
    type: function
    file: src/ucn_node.c
    layer: security
    role: 在业务/控制分派前执行 RX 授权、策略匹配、Tag 验证和目标端解密。
    called_by:
      - node_runtime.ucn_node_receive
    calls:
      - target: external.security_provider_authorize_rx
        type: callback
        reason: 对 ingress Link、来源和帧身份进行 ACL/反重放检查。
      - target: frame.ucn_frame_write_e2e_aad
        type: direct
        reason: 生成与发送端相同的认证附加数据。
      - target: external.security_provider_open
        type: callback
        reason: 仅目标 Node 解密并验证 Tag。
    notes:
      - 允许的中继只依据外层 Route/Path 转发密文；它不调用 open，不需要业务密钥。
      - CRC 先于该函数完成，不能代替安全校验。
