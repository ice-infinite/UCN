project: UCN
protocol_version: "5"
description: MCU-first UCN Core 调用关系索引；Linux 仅是可选 Host/Adapter，不是路由前提。
source_root: E:\File\MESH\UCN

modules:
  - id: core
    file: core.calltree.yaml
    status: current
    role: 配置校验与静态 Endpoint/控制消息边界
    entry: core.ucn_validate_config
    source_files: [src/core/ucn_core.c, src/core/ucn_endpoint.c]

  - id: frame
    file: frame.calltree.yaml
    status: current
    role: v5 W0～W3 Prefix Peek、编解码、自动最小档、CRC 和 E2E AAD
    entry: frame.ucn_frame_encode
    source_files: [src/core/ucn_frame.c]

  - id: adapter
    file: adapter.calltree.yaml
    status: current
    role: 物理地址绑定、固定 RX Queue、独立 Platform Port 与公共 Protocol Owner Pump
    entry: adapter.platform_port_rx_enqueue
    source_files: [src/transport/ucn_adapter.c, src/transport/ucn_protocol_owner.c, src/ports/ucn_port_freertos.c]

  - id: event_runtime
    file: event_runtime.calltree.yaml
    status: current_host_software_verified
    role: 固定多 Bearer Source、Task/ISR 事件合并、有界 Drain 与 Owner 唤醒
    entry: event_runtime.ucn_event_runtime_task_cycle
    source_files: [src/transport/ucn_event_runtime.c]

  - id: stream_source
    file: stream_source.calltree.yaml
    status: current_host_software_verified
    role: UART/RS-485/USB CDC 固定 Byte Ring、COBS+0 Carrier、缺口恢复与 Queue 背压
    entry: stream_source.ucn_stream_source_write_from_isr
    source_files: [src/adapters/stream/ucn_stream_source.c]

  - id: can_source
    file: can_source.calltree.yaml
    status: current_host_software_verified
    role: CAN-FD 直接帧、经典 CAN 有界 Carrier、固定 Frame Ring、Bus-Off 与过滤
    entry: can_source.ucn_can_source_write_from_isr
    source_files: [src/adapters/can/ucn_can_source.c]

  - id: node_runtime
    file: node_runtime.calltree.yaml
    status: current
    role: Node 初始化、收包分发、转发与唯一 Protocol Task 调度
    entry: node_runtime.ucn_node_step
    source_files: [src/node/ucn_node.c]
  - id: neighbor
    file: neighbor.calltree.yaml
    status: current
    role: HELLO 准入、Neighbor/Bearer 生命周期、Heartbeat 和主备切换
    entry: neighbor.ucn_node_observe_neighbor
    source_files: [src/node/ucn_node.c]

  - id: route
    file: route.calltree.yaml
    status: current
    role: Endpoint 发送、Hop/Cost/RTT 门禁、Expanding Ring、Route Cache 与 RREQ/RREP/RERR
    entry: route.ucn_node_send_endpoint
    source_files: [src/node/ucn_node.c]

  - id: policy_path
    file: policy_path.calltree.yaml
    status: current
    role: 策略、Remaining-Hops 受控 Path、Strict/Failover 和 Q1 流亲和均衡
    entry: policy_path.ucn_node_set_route_policy
    source_files: [src/routing/ucn_policy.c, src/routing/ucn_path.c, src/node/ucn_node.c]

  - id: security
    file: security.calltree.yaml
    status: current_provider_boundary
    role: 安全 Provider、端到端保护、ACL 和透明转发边界
    entry: security.ucn_node_set_security
    source_files: [src/node/ucn_node.c, src/core/ucn_frame.c]

  - id: service
    file: service.calltree.yaml
    status: current
    role: MCU 内任务 Router、Remote TX 与 Protocol Task Bridge
    entry: service.ucn_service_send
    source_files: [src/service/ucn_service.c, src/service/ucn_service_bridge.c]

  - id: transfer
    file: transfer.calltree.yaml
    status: current_host_software_verified
    role: T32～T8K 有界逻辑消息、固定分片/重组、ACK/重试和 RX Handle
    entry: transfer.ucn_transfer_send
    source_files: [src/extended/ucn_transfer.c]

  - id: diagnostic
    file: diagnostic.calltree.yaml
    status: current_core_virtual_verified
    role: 按需 Path Trace、Node Snapshot、Policy Diagnostic
    entry: diagnostic.ucn_node_request_path_trace
    source_files: [src/node/ucn_node.c]
