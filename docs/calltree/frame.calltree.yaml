module: frame
description: v5 W0/W1/W2/W3 官方 Header、CRC-16 和端到端 AAD 编解码路径。
entry: frame.ucn_frame_encode
source_files:
  - src/ucn_frame.c

nodes:
  - id: frame.ucn_wire_profile_get_descriptor
    symbol: ucn_wire_profile_get_descriptor
    type: function
    file: src/ucn_frame.c
    layer: core
    role: 按 API Profile 返回唯一只读官方描述符；不接受用户自定义字段宽度。
    called_by:
      - frame.ucn_frame_header_size_for_profile
      - frame.ucn_frame_max_payload_for_profile
      - frame.ucn_frame_encoded_size
      - frame.ucn_frame_encode
      - frame.ucn_frame_peek_wire_profile
      - frame.ucn_frame_decode
      - frame.ucn_frame_write_e2e_aad
      - frame.ucn_frame_select_min_wire_profile
      - external.application_encoder
    calls: []

  - id: frame.ucn_frame_header_size_for_profile
    symbol: ucn_frame_header_size_for_profile
    type: function
    file: src/ucn_frame.c
    layer: core
    role: 由 W0～W3 Descriptor 与 Route/Path Flag 唯一推导 17～36 B Header。
    called_by:
      - frame.ucn_frame_max_payload_for_profile
      - frame.ucn_frame_encoded_size
      - frame.ucn_frame_encode
      - frame.ucn_frame_decode
      - external.application_encoder
    calls:
      - target: frame.ucn_wire_profile_get_descriptor
        type: direct
        reason: 未指定 Profile 兼容解析为 W3，显式值只接受四个官方档位。

  - id: frame.ucn_frame_max_payload_for_profile
    symbol: ucn_frame_max_payload_for_profile
    type: function
    file: src/ucn_frame.c
    layer: core
    role: 同时按 Profile Length 宽度、实际 Header、Tag、UCN_MAX_FRAME_BYTES 和静态 Payload 上限裁剪。
    called_by:
      - frame.ucn_frame_max_payload
      - frame.profile_validation_helpers_static
      - external.application_encoder
    calls:
      - target: frame.ucn_wire_profile_get_descriptor
        type: direct
        reason: 读取 Length 字段宽度。
      - target: frame.ucn_frame_header_size_for_profile
        type: direct
        reason: 扣除实际 Header 和可选 16 B Tag。

  - id: frame.ucn_frame_max_payload
    symbol: ucn_frame_max_payload
    type: function
    file: src/ucn_frame.c
    layer: core
    role: 为旧调用保留的 W3 Payload 上限查询。
    called_by:
      - external.application_encoder
    calls:
      - target: frame.ucn_frame_max_payload_for_profile
        type: direct
        reason: 固定以 W3 执行 Profile-aware 计算。

  - id: frame.ucn_frame_select_min_wire_profile
    symbol: ucn_frame_select_min_wire_profile
    type: function
    file: src/ucn_frame.c
    layer: core
    role: 在官方 W0～W3 中选择能完整表达当前字段且满足最大档与实际 MTU 的最小档；可选 Tag 已计入最终长度。
    called_by:
      - node_runtime.prepare_outbound_wire_profile_static
      - external.application_encoder
    calls:
      - target: frame.ucn_wire_profile_get_descriptor
        type: direct
        reason: 只遍历官方固定档位。
      - target: frame.ucn_frame_encoded_size
        type: direct
        reason: 逐档校验地址、Hop、Route/Path、Payload、Tag 与 MTU。
    notes:
      - 无可用共同档返回错误，不截断字段，也不回退到超出 Peer Ceiling 的 W3。

  - id: frame.ucn_frame_encoded_size
    symbol: ucn_frame_encoded_size
    type: function
    file: src/ucn_frame.c
    layer: core
    role: 校验 Profile/字段/扩展/Tag 后，计算 Header、Payload 与可选 Tag 的最终长度。
    called_by:
      - frame.ucn_frame_encode
      - node_runtime.send_frame_on_link
    calls:
      - target: frame.profile_validation_helpers_static
        type: direct
        reason: 拒绝地址、Hop、Length、Route Epoch、Path ID 和 Flag 超出官方档位。
      - target: frame.ucn_frame_header_size_for_profile
        type: direct
        reason: 取得 Profile+Flags 唯一 Header 长度。

  - id: frame.ucn_frame_encode
    symbol: ucn_frame_encode
    type: function
    file: src/ucn_frame.c
    layer: core
    role: 将 ucn_frame_t 编为官方 W0～W3 字节序列，写 Header、Payload、可选 Tag 和 CRC。
    called_by:
      - node_runtime.send_frame_on_link
      - node_runtime.send_control_on_link
    calls:
      - target: frame.profile_validation_helpers_static
        type: direct
        reason: 未指定 Profile 解析为 W3，超范围失败而不截断。
      - target: frame.ucn_frame_encoded_size
        type: direct
        reason: 校验最终输出容量。
      - target: frame.ucn_frame_header_size_for_profile
        type: direct
        reason: 推导 CRC 和 Payload 起始位置。
      - target: frame.ucn_crc16_ccitt
        type: direct
        reason: 覆盖 Header CRC 前缀、Payload 和可选 Tag。
    notes:
      - CRC 仅检错，不提供身份认证或防篡改能力。

  - id: frame.ucn_frame_peek_wire_profile
    symbol: ucn_frame_peek_wire_profile
    type: function
    file: src/ucn_frame.c
    layer: core
    role: 只读取固定 3 B Prefix，校验 Magic、Version 与官方 Profile Code，供 Ingress 在完整 Decode/CRC 前执行本地 RX Ceiling 门禁。
    called_by:
      - frame.ucn_frame_decode
      - node_runtime.ucn_node_receive
    calls:
      - target: frame.ucn_wire_profile_get_descriptor
        type: direct
        reason: 只接受官方 W0～W3 Profile。
    notes:
      - Peek 不校验长度以外的帧语义、CRC 或认证，也不替代完整 Decode。

  - id: frame.ucn_frame_decode
    symbol: ucn_frame_decode
    type: function
    file: src/ucn_frame.c
    layer: core
    role: 先解析 Version+Profile 和 Traffic+Flags，再推导 Header，校验字段、长度、Hop、CRC并返回视图。
    called_by:
      - node_runtime.ucn_node_receive
    calls:
      - target: frame.ucn_frame_peek_wire_profile
        type: direct
        reason: 复用统一 Prefix 解析和错误语义。
      - target: frame.ucn_wire_profile_get_descriptor
        type: direct
        reason: 由线上 2 bit Code 选择官方 Descriptor。
      - target: frame.ucn_frame_header_size_for_profile
        type: direct
        reason: 不依赖线上 Header Size 字段推导布局。
      - target: frame.profile_validation_helpers_static
        type: direct
        reason: CRC 后执行完整语义边界校验。
      - target: frame.ucn_crc16_ccitt
        type: direct
        reason: 重算并对比接收帧 CRC。
    outputs:
      - 成功：wire_profile 为明确 W0～W3，payload/auth_tag 指向本次输入缓冲区。
      - 失败：UCN_ERR_MALFORMED、UCN_ERR_VERSION 或 UCN_ERR_CRC。
    notes:
      - 调用者必须在 Payload 被使用期间保持输入缓冲区有效。

  - id: frame.ucn_frame_write_e2e_aad
    symbol: ucn_frame_write_e2e_aad
    type: function
    file: src/ucn_frame.c
    layer: security
    role: 生成 30 B 规范 AAD；Profile+Version、地址、Sequence、Session、Length 和可选 Path ID 被绑定。
    called_by:
      - security.protect_outbound_business
      - security.validate_inbound_business_security
      - external.security_provider
    calls:
      - target: frame.profile_validation_helpers_static
        type: direct
        reason: AAD 生成前拒绝无法由目标 Profile 表示的字段。
    notes:
      - Hop Limit/Route Epoch 不在 AAD 内；Wire Profile 已绑定，透明中继不能改档后复用旧 Tag。

  - id: frame.ucn_crc16_ccitt
    symbol: ucn_crc16_ccitt
    type: function
    file: src/ucn_frame.c
    layer: core
    role: CRC-16/CCITT 基础计算函数。
    called_by:
      - frame.ucn_frame_encode
      - frame.ucn_frame_decode
    calls: []

  - id: frame.profile_validation_helpers_static
    symbol: resolve_profile/validate_frame_fields/read_uint_be/write_uint_be
    type: function
    file: src/ucn_frame.c
    layer: core
    role: 完成 Profile 默认解析、宽度读写、广播映射和所有字段范围的失败关闭校验。
    called_by:
      - frame.ucn_frame_max_payload_for_profile
      - frame.ucn_frame_encoded_size
      - frame.ucn_frame_encode
      - frame.ucn_frame_decode
      - frame.ucn_frame_write_e2e_aad
    calls:
      - target: frame.ucn_wire_profile_get_descriptor
        type: direct
        reason: 所有宽度和上限只来自官方固定表。
      - target: frame.ucn_frame_max_payload_for_profile
        type: direct
        reason: 校验 Payload 的路径无关本机上限。
