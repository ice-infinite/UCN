name: UCN Core CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug
            cmake_args: -DCMAKE_BUILD_TYPE=Debug
          - name: release
            cmake_args: -DCMAKE_BUILD_TYPE=Release
          - name: mtu64
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS=-DUCN_MAX_FRAME_BYTES=64
          - name: bearer1
            cmake_args: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS=-DUCN_MAX_BEARERS_PER_NEIGHBOR=1
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    name: asan-ubsan
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitize --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
