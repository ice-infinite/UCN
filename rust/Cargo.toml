[workspace]
resolver = "3"
members = [
    "crates/ucn-adapter",
    "crates/ucn-core",
    "crates/ucn-owner",
    "crates/ucn-persistence",
    "crates/ucn-types",
    "crates/ucn-wire",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/ice-infinite/UCN"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
